name: Publish 20 sites to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'sites/**'
      - 'packages/**'
      - 'scripts/**'
      - 'bun.lock'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: a8a6f999d47c520aff2edbec532fab5c
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions. The token needs Account / Cloudflare Pages / Edit for the deployment account."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.6'
      - run: bun install --frozen-lockfile
      - run: bun run build --filter=fleet-* --concurrency=4
      - name: Install Wrangler
        run: npm install --global wrangler@4.160.0
      - name: Publish all 20 production sites
        run: node scripts/deploy-demo-sites.mjs
